    <rect x="600" y="40" width="20" height="20" rx="3"/>
    <rect x="650" y="60" width="20" height="20" rx="3"/>
  </g>

  <g filter="url(#snakeGlow)">
    <g fill="url(#snakeGrad)">
      <rect x="10" y="100" width="18" height="18" rx="4" opacity="1"/>
      <rect x="32" y="100" width="18" height="18" rx="4" opacity="0.95"/>
      <rect x="54" y="100" width="18" height="18" rx="4" opacity="0.9"/>
      <rect x="76" y="100" width="18" height="18" rx="4" opacity="0.85"/>
      <rect x="98" y="100" width="18" height="18" rx="4" opacity="0.8"/>
