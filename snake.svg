      keyTimes="0; 0.15; 0.25; 0.4; 0.55; 0.65; 0.8; 0.9; 1"
      dur="6s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>

  <text x="350" y="165" font-family="monospace" font-size="11" fill="#8b949e" opacity="0.5" text-anchor="middle">
    SCORE: 09999
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </text>

  <text x="10" y="165" font-family="monospace" font-size="9" fill="#3fb950" opacity="0.4">
    &gt;_ snake.ai
  </text>
