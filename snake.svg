      <rect x="186" y="100" width="18" height="18" rx="4" opacity="0.6"/>
      <rect x="208" y="100" width="18" height="18" rx="4" opacity="0.55"/>
      <rect x="230" y="100" width="18" height="18" rx="4" opacity="0.5"/>
      <rect x="252" y="100" width="18" height="18" rx="4" opacity="0.45"/>
      <rect x="274" y="100" width="18" height="18" rx="4" opacity="0.4"/>
    </g>
    <circle cx="19" cy="109" r="3" fill="#3fb950"/>
    <circle cx="20" cy="108" r="1.5" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-80; 200,-80; 200,0; 400,0; 400,-80; 600,-80; 600,0; 660,0"
      keyTimes="0; 0.15; 0.25; 0.4; 0.55; 0.65; 0.8; 0.9; 1"
      dur="6s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>

  <g>
    <circle cx="0" cy="0" r="6" fill="#f0883e" opacity="0.8"/>
    <animateTransform attributeName="transform" type="translate"
