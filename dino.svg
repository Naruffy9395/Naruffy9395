<svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="150" fill="#0d1117"/>

  <line x1="0" y1="120" x2="600" y2="120" stroke="#535353" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <g id="dino" fill="#535353">
    <rect x="50" y="88" width="10" height="10"/>
    <rect x="40" y="98" width="30" height="20"/>
    <rect x="40" y="118" width="8" height="10"/>
    <rect x="60" y="118" width="8" height="10"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; 0,-42; 0,-42; 0,0; 0,0"
      keyTimes="0; 0.72; 0.80; 0.88; 0.95; 1"
      dur="3s" repeatCount="indefinite"/>
  </g>

  <g fill="#5fba4e">
    <rect x="0" y="100" width="6" height="20"/>
    <rect x="-6" y="106" width="6" height="8"/>
    <rect x="6" y="106" width="6" height="8"/>
    <animateTransform attributeName="transform" type="translate"
      values="650,0; -60,0"
      dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
