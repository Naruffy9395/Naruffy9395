<svg viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="dinoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="cactusGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="160" fill="url(#sky)" rx="12"/>

  <circle cx="560" cy="35" r="50" fill="url(#sun)"/>
  <circle cx="560" cy="35" r="14" fill="#f0883e" opacity="0.5"/>

  <g fill="#21262d">
    <polygon points="0,120 60,60 120,120"/>
    <polygon points="80,120 150,70 220,120"/>
    <polygon points="180,120 240,50 300,120"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -300,0" dur="12s" repeatCount="indefinite"/>
  </g>

  <line x1="0" y1="125" x2="700" y2="125" stroke="#30363d" stroke-width="2"/>
  <line x1="0" y1="125" x2="700" y2="125" stroke="#58a6ff" stroke-width="1" stroke-dasharray="8 12" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="0.4s" repeatCount="indefinite"/>
  </line>

  <g fill="#30363d">
    <rect x="20" y="118" width="3" height="7"/>
    <rect x="80" y="118" width="3" height="7"/>
    <rect x="140" y="118" width="3" height="7"/>
    <rect x="200" y="118" width="3" height="7"/>
    <rect x="260" y="118" width="3" height="7"/>
    <rect x="320" y="118" width="3" height="7"/>
    <rect x="380" y="118" width="3" height="7"/>
    <rect x="440" y="118" width="3" height="7"/>
    <rect x="500" y="118" width="3" height="7"/>
    <rect x="560" y="118" width="3" height="7"/>
    <rect x="620" y="118" width="3" height="7"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -40,0" dur="0.3s" repeatCount="indefinite"/>
  </g>

  <g id="dino" filter="url(#glow)">
    <g fill="url(#dinoGrad)">
      <rect x="52" y="78" width="22" height="22" rx="2"/>
      <rect x="64" y="62" width="20" height="20" rx="3"/>
      <rect x="78" y="56" width="22" height="22" rx="2"/>
      <rect x="96" y="60" width="8" height="8" rx="1"/>
      <rect x="40" y="98" width="44" height="22" rx="2"/>
      <rect x="40" y="118" width="10" height="8" rx="1"/>
      <rect x="62" y="118" width="10" height="8" rx="1"/>
      <rect x="84" y="100" width="12" height="6" rx="1"/>
    </g>
    <circle cx="90" cy="66" r="2.5" fill="#0d1117"/>
    <circle cx="91" cy="65" r="1" fill="#ffffff"/>
    <rect x="74" y="72" width="3" height="2" fill="#0d1117" rx="0.5"/>
    <rect x="48" y="102" width="4" height="3" fill="#0d1117" rx="0.5"/>
    <rect x="56" y="102" width="4" height="3" fill="#0d1117" rx="0.5"/>
    <rect x="64" y="102" width="4" height="3" fill="#0d1117" rx="0.5"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; 0,-38; 0,-38; 0,0; 0,0"
      keyTimes="0; 0.65; 0.73; 0.82; 0.90; 1"
      dur="2.8s" repeatCount="indefinite"/>
  </g>

  <g>
    <g fill="url(#cactusGrad)">
      <rect x="0" y="95" width="8" height="30" rx="2"/>
      <rect x="-8" y="103" width="8" height="14" rx="2"/>
      <rect x="8" y="100" width="8" height="14" rx="2"/>
      <rect x="-4" y="88" width="4" height="8" rx="1"/>
      <rect x="6" y="85" width="4" height="10" rx="1"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="750,0; -80,0" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <g>
    <g fill="url(#cactusGrad)">
      <rect x="0" y="90" width="10" height="35" rx="2"/>
      <rect x="-10" y="100" width="10" height="16" rx="2"/>
      <rect x="10" y="97" width="10" height="16" rx="2"/>
      <rect x="-5" y="82" width="5" height="9" rx="1"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="950,0; -80,0" dur="4.2s" repeatCount="indefinite"/>
  </g>

  <g fill="#8b949e" opacity="0.3">
    <circle cx="100" cy="40" r="1"/>
    <circle cx="200" cy="25" r="1.5"/>
    <circle cx="300" cy="50" r="1"/>
    <circle cx="400" cy="30" r="1.5"/>
    <circle cx="500" cy="45" r="1"/>
    <circle cx="620" cy="20" r="1"/>
    <circle cx="680" cy="50" r="1.5"/>
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="145" font-family="monospace" font-size="10" fill="#58a6ff" opacity="0.6">
    HI 09999
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
